name: Python regression tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Python syntax verification
        run: python -m compileall -q app.py etf_engine.py reference_match.py research_analysis.py structure_similarity.py industry_taxonomy.py research_registry.py evidence_overlay.py data_quality.py upload_diagnostics.py tests
      - name: Run regression tests
        run: python -m pytest -q tests
